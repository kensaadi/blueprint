name: CI

on:
  push:
    branches: [main]
  pull_request:

# One run per ref — a newer push cancels the older in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: build · typecheck · lint · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # reads packageManager (pnpm@10.7.1) from package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # esbuild ships a native binary via a build script; ensure it's present
      # (pnpm gates build scripts behind onlyBuiltDependencies).
      - run: pnpm rebuild esbuild

      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
